<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envanter Yönetimi Test Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">📦 Envanter Yönetimi Test Paneli</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Ürün Ekleme Formu -->
            <div class="bg-blue-50 p-4 rounded border border-blue-100">
                <h2 class="text-xl font-semibold mb-4 text-blue-800">1. Yeni Ürün Ekle</h2>
                <form id="productForm" class="space-y-3">
                    <div>
                        <label class="block text-sm">Stok Kodu (SKU)</label>
                        <input type="text" id="sku_code" class="w-full p-2 border rounded" value="UN-002" required>
                    </div>
                    <div>
                        <label class="block text-sm">Ürün Adı</label>
                        <input type="text" id="name" class="w-full p-2 border rounded" value="Tam Buğday Unu" required>
                    </div>
                    <div class="flex gap-4">
                        <div class="w-1/2">
                            <label class="block text-sm">Birim</label>
                            <input type="text" id="unit" class="w-full p-2 border rounded" value="kg" required>
                        </div>
                        <div class="w-1/2">
                            <label class="block text-sm">Kritik Stok</label>
                            <input type="number" id="min_stock_level" class="w-full p-2 border rounded" value="20" required>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Ürünü Kaydet</button>
                </form>
            </div>

            <!-- Stok Hareketi Formu -->
            <div class="bg-green-50 p-4 rounded border border-green-100">
                <h2 class="text-xl font-semibold mb-4 text-green-800">2. Stok Hareketi Ekle (IN/OUT)</h2>
                <form id="movementForm" class="space-y-3">
                    <div>
                        <label class="block text-sm">Ürün Seçin</label>
                        <select id="product_id" class="w-full p-2 border rounded" required>
                            <!-- JS ile doldurulacak -->
                        </select>
                    </div>
                    <div class="flex gap-4">
                        <div class="w-1/2">
                            <label class="block text-sm">İşlem Tipi</label>
                            <select id="movement_type" class="w-full p-2 border rounded">
                                <option value="IN">Giriş (IN)</option>
                                <option value="OUT">Çıkış (OUT) - WhatsApp Test</option>
                            </select>
                        </div>
                        <div class="w-1/2">
                            <label class="block text-sm">Miktar</label>
                            <input type="number" id="quantity" class="w-full p-2 border rounded" value="50" required>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700">Hareketi Kaydet</button>
                </form>
            </div>
        </div>

        <!-- Ürün Listesi -->
        <div class="mt-10">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">Güncel Ürün Listesi ve Stoklar</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="p-3 border">Stok Kodu</th>
                            <th class="p-3 border">Ürün Adı</th>
                            <th class="p-3 border">Güncel Stok</th>
                            <th class="p-3 border">Kritik Seviye</th>
                        </tr>
                    </thead>
                    <tbody id="productList">
                        <!-- JS ile doldurulacak -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="alertModal" class="fixed top-4 right-4 bg-gray-800 text-white p-4 rounded shadow-lg hidden transition-opacity">
        <span id="alertMessage">Mesaj</span>
    </div>

    <script>
        const API_URL = '/api';

        function showAlert(msg, isError = false) {
            const modal = document.getElementById('alertModal');
            modal.style.backgroundColor = isError ? '#ef4444' : '#10b981';
            document.getElementById('alertMessage').innerText = msg;
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('hidden'), 3000);
        }

        async function loadProducts() {
            try {
                const res = await fetch(`${API_URL}/products`);
                const products = await res.json();
                
                const select = document.getElementById('product_id');
                const list = document.getElementById('productList');
                
                select.innerHTML = '';
                list.innerHTML = '';
                
                products.forEach(p => {
                    // select doldur
                    const opt = document.createElement('option');
                    opt.value = p._id;
                    opt.text = `${p.name} (Stok: ${p.current_stock} ${p.unit})`;
                    select.appendChild(opt);

                    // tablo doldur
                    const isCritical = p.current_stock < p.min_stock_level;
                    const tr = document.createElement('tr');
                    tr.className = isCritical ? 'bg-red-50' : 'bg-white';
                    tr.innerHTML = `
                        <td class="p-3 border">${p.sku_code}</td>
                        <td class="p-3 border font-semibold">${p.name}</td>
                        <td class="p-3 border font-bold ${isCritical ? 'text-red-600' : 'text-green-600'}">${p.current_stock} ${p.unit}</td>
                        <td class="p-3 border text-gray-500">${p.min_stock_level} ${p.unit}</td>
                    `;
                    list.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                sku_code: document.getElementById('sku_code').value,
                name: document.getElementById('name').value,
                unit: document.getElementById('unit').value,
                min_stock_level: Number(document.getElementById('min_stock_level').value)
            };

            try {
                const res = await fetch(`${API_URL}/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    showAlert('Ürün başarıyla eklendi!');
                    loadProducts();
                } else {
                    const err = await res.json();
                    showAlert(err.error || 'Hata oluştu', true);
                }
            } catch (err) {
                showAlert('Bağlantı hatası', true);
            }
        });

        document.getElementById('movementForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                product_id: document.getElementById('product_id').value,
                movement_type: document.getElementById('movement_type').value,
                quantity: Number(document.getElementById('quantity').value)
            };

            try {
                const res = await fetch(`${API_URL}/movements`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if(res.ok) {
                    showAlert('Stok hareketi başarıyla işlendi!');
                    loadProducts();
                } else {
                    const err = await res.json();
                    showAlert(err.error || 'Hata oluştu', true);
                }
            } catch (err) {
                showAlert('Bağlantı hatası', true);
            }
        });

        // initial load
        loadProducts();
    </script>
</body>
</html>
