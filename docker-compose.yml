services:
  envanter_backend:
    build: ./backend
    container_name: envanter_backend
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - MONGODB_URI=mongodb://host.docker.internal:27018/envanter_db
      - WHATSAPP_API_URL=http://host.docker.internal:3000/api/v1/campaigns
      - WHATSAPP_API_KEY=wa_80121692114fb8adb2317084c9566f73761d656f45150de7b97fa6ee7ca9991f
      - WHATSAPP_TARGET_TAG=YÖNETİCİ
    restart: unless-stopped

  envanter_frontend:
    build: ./frontend
    container_name: envanter_frontend
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - envanter_backend
    restart: unless-stopped

